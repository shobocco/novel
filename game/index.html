<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>残クレバハムートで魔王討伐</title>
  <script>window.CACHE_BUST=Date.now();document.write('<link rel="stylesheet" href="css/style.css?v='+window.CACHE_BUST+'">')</script>
</head>
<body>
  <main id="game" aria-live="polite">
    <section id="title-screen" class="screen active">
      <div class="title-card"><p class="eyebrow">FANTASY × RESIDUAL VALUE LOAN</p><h1>残クレバハムートで<br><span>魔王討伐</span></h1><p>10億Gの相棒と、月々10万Gの冒険。</p><div class="title-actions"><button id="start-btn">GAME START</button><button id="continue-btn" class="secondary">CONTINUE</button><button id="debug-start-btn" class="ghost">DEBUG START</button></div></div>
    </section>
    <section id="play-screen" class="screen">
      <div id="background"></div><div id="effect-layer"></div><div id="chapter-card"></div>
      <div id="characters"><div class="character-slot left"></div><div class="character-slot center"></div><div class="character-slot right"></div></div><div id="enemy-layer"></div>
      <aside id="status" class="contract-locked"><h2>CONTRACT STATUS</h2><dl><div><dt>所持金</dt><dd id="money">0 G</dd></div><div><dt>次回支払</dt><dd id="payment">0 G</dd></div><div><dt>返済回数</dt><dd id="payments">0 / 0</dd></div></dl><hr><p id="bahamut-status"></p></aside>
      <div id="toast"></div><div id="choices"></div>
      <section id="battle-panel" aria-label="バトル画面"><div class="battle-top"><div class="battle-unit"><span>主人公</span><strong id="battle-hero-hp"></strong><small id="battle-hero-stats"></small><div class="hp-track"><i id="battle-hero-bar"></i></div><strong id="battle-hero-mp"></strong><div class="mp-track"><i id="battle-hero-mp-bar"></i></div></div><div class="battle-turn" id="battle-turn"></div><div class="battle-unit enemy"><span id="battle-enemy-name"></span><strong id="battle-enemy-hp"></strong><div class="hp-track"><i id="battle-enemy-bar"></i></div><small id="battle-enemy-intent"></small></div></div><div id="battle-log"></div><div id="battle-commands"><button data-battle-action="attack">剣で攻撃</button><button data-battle-action="guard">防御</button><button data-battle-action="attack_magic">攻撃魔法</button><button data-battle-action="heal_magic">回復魔法</button><button data-battle-action="potion">ポーション</button><button data-battle-action="bahamut">バハムート</button></div></section>
      <div id="text-window"><div id="speaker"></div><p id="text"></p><span id="next-mark">▼</span></div>
      <div id="debug-panel"><div id="debug-values"></div><div><button data-debug="money">+100,000 G</button><button data-debug="value">価値 +10</button><button data-debug="condition">状態 +10</button><button data-debug="trust">信頼 +10</button></div></div>
      <button id="save-btn" title="現在地点を保存">SAVE</button>
    </section>
    <section id="ending-screen" class="screen"><div class="ending-card"><p>STORY COMPLETE</p><h2 id="ending-title"></h2><div id="ending-text"></div><button id="title-btn">タイトルへ戻る</button></div></section>
    <div id="modal" class="modal"><div class="modal-card"><button id="modal-close" aria-label="閉じる">×</button><img id="modal-image" alt="書類"><p id="modal-caption"></p></div></div>
    <div id="error-box"></div>
  </main>
  <script>document.write('<script src="js/scenario_bundle.js?v='+window.CACHE_BUST+'"><\/script>');document.write('<script src="js/game_bundle.js?v='+window.CACHE_BUST+'"><\/script>')</script>
</body>
</html>
